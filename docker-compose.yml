services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codecollab
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:api"
    environment:
      API_PORT: 4600
      NEXT_PUBLIC_APP_URL: http://localhost:3600
      JWT_SECRET: replace-me
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/codecollab
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml:8600
      SNAPSHOT_INTERVAL_SECONDS: 30
    ports:
      - "4600:4600"
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis
      - ml

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:web"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4600
      NEXT_PUBLIC_WS_URL: http://localhost:4600
    ports:
      - "3600:3600"
    volumes:
      - ./:/app
    depends_on:
      - api

  ml:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install -r ml_service/requirements.txt && uvicorn ml_service.main:app --host 0.0.0.0 --port 8600"
    ports:
      - "8600:8600"
    volumes:
      - ./:/app

volumes:
  pg_data:
